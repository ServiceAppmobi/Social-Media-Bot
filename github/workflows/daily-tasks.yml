name: ServiceApp Daily Tasks Email

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0,10);
            const body = `## Zadania na dzis - ${today}\n\n1. Brazylia - 1 post dziennie - wez tekst z Actions -> ServiceApp Daily Drafts\n2. Meksyk - 1 post dziennie - wez tekst z pliku benefits_mx.py\n3. Reels - 1 Reels 15 sekund - wez scenariusz z pliku reels_scripts.py\n4. Opinie - po zakonczonym zleceniu wyslij 1 prosbe z pliku review_request.py\n5. SEO - jak masz czas, wklej 1 artykul na serviceapp.mobi z pliku seo_pages.py lub seo_pages_mx.py\n\nPowodzenia. Konto oficjalne ServiceApp`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Zadania na dzis - ${today}`,
              body: body,
              labels: ['daily-tasks']
            });
