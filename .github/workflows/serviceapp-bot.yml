name: ServiceApp LatAm Lead Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-internet:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sprawdź internet i odpowiedz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/serviceapp-bot.mjs
