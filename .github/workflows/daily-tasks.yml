name: ServiceApp Daily Tasks Email

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Utworz zadanie na dzis
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toLocaleDateString('pl-PL');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Zadania na dzis - ${date}`,
              body: `## ServiceApp - zadania na dzis\n\n1. **Brazylia - 1 post:** Opublikuj 1 post w grupie ServiceApp Sao Paulo / Servicos - Conta oficial ServiceApp\n2. **Meksyk - 1 post:** Opublikuj 1 post w grupie ServiceApp Meksyk - Conta oficial ServiceApp\n3. **Reels - 1 film:** Nagraj / opublikuj 1 Reels z gotowego scenariusza\n4. **Opinie - 1 prosba:** Popros 1 klienta po zakonczonym zleceniu o opinie\n5. **SEO - jak starczy czasu:** Dodaj 1 artykul SEO na serviceapp.mobi\n\nLimit: max 1-2 posty dziennie, tylko w dzien, czas Brazylii.`
            });
